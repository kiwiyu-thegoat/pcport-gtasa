.github/workflows/
name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply GTA SA overlay
        run: |
          if [ -f overlay.zip ]; then unzip -o overlay.zip -d . && rm overlay.zip; fi
      - name: Retarget bundled system files to the new app ID
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd patchelf file
          chmod +x tools/retarget-assets.sh
          KEEP_BACKUP=0 ./tools/retarget-assets.sh app/src/main/assets 2>&1 | tee retarget.log
      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-Launcher-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retarget-log
          path: retarget.log
          if-no-files-found: ignore
